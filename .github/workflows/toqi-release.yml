name: Apply approved Hellou update
on:
  push:
    branches: [toqi/hellou-publicar-validado]
    paths: [.github/workflows/toqi-release.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed patch and remove publication helpers
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,base64,subprocess,shutil
          parts=sorted(pathlib.Path('.toqi-release').glob('part-*'))
          patch=base64.b64decode(''.join(p.read_text() for p in parts))
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          shutil.rmtree('.toqi-release')
          pathlib.Path('.github/workflows/toqi-release.yml').unlink()
          PY
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply approved shipment notice, CPF requirement and WhatsApp button'
          git push origin HEAD:toqi/hellou-publicar-validado
